name: CodeQL PR Results

on:
  workflow_run:
    workflows:
      - CodeQL
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: codeql-pr-upload-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze-and-upload:
    name: Publish trusted PR analysis
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.path == '.github/workflows/codeql.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Verify current pull request revision
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const associated = run.pull_requests?.[0];
            let pr;

            if (associated) {
              ({ data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: associated.number,
              }));
            } else {
              // GitHub may omit workflow_run.pull_requests for fork PRs.
              // Resolve by source repository, branch, and exact scanned SHA.
              const headRepo = run.head_repository;
              if (!headRepo || !run.head_branch) {
                core.notice("The source run has no head repository or branch; skipping CodeQL publication.");
                core.setOutput("scan", "false");
                return;
              }

              const { data: candidates } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                head: `${headRepo.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
              const matches = candidates.filter(candidate =>
                candidate.head.sha === run.head_sha &&
                candidate.head.repo?.id === headRepo.id &&
                ["development", "master"].includes(candidate.base.ref)
              );

              if (matches.length !== 1) {
                core.notice(`Expected one open PR for scanned head ${run.head_sha}, found ${matches.length}; skipping publication.`);
                core.setOutput("scan", "false");
                return;
              }
              pr = matches[0];
            }

            const valid =
              pr.state === "open" &&
              ["development", "master"].includes(pr.base.ref) &&
              pr.head.sha === run.head_sha &&
              pr.head.repo?.id === run.head_repository?.id;

            if (!valid) {
              core.notice("Pull request is closed, targets an unsupported branch, or no longer matches the scanned repository and commit; skipping stale results.");
              core.setOutput("scan", "false");
              return;
            }

            core.setOutput("scan", "true");
            core.setOutput("number", String(pr.number));
            core.setOutput("repository", pr.head.repo.full_name);
            core.setOutput("sha", pr.head.sha);

      # This workflow runs from the default branch. The PR checkout is input
      # data for CodeQL only; never execute code from this directory.
      - name: Checkout pull request
        if: steps.pr.outputs.scan == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pr.outputs.repository }}
          ref: ${{ steps.pr.outputs.sha }}
          path: src
          persist-credentials: false
          # Safe only because this checkout is static-analysis input; no PR
          # scripts, actions, builds, or configuration are executed.
          allow-unsafe-pr-checkout: true

      - name: Initialize CodeQL
        if: steps.pr.outputs.scan == 'true'
        id: codeql_init
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended
          source-root: src

      - name: Perform CodeQL analysis
        if: steps.pr.outputs.scan == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
          output: ${{ runner.temp }}/codeql-results
          upload: never

      # The SARIF was generated by this trusted workflow run, not by the PR
      # workflow. The CodeQL CLI supports explicit refs for fork PRs.
      - name: Upload pull request results
        if: steps.pr.outputs.scan == 'true'
        env:
          CODEQL: ${{ steps.codeql_init.outputs.codeql-path }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_HEAD_SHA: ${{ steps.pr.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t sarif_files < <(find "${{ runner.temp }}/codeql-results" -maxdepth 1 -type f -name '*.sarif' -print)
          if [ "${#sarif_files[@]}" -ne 1 ]; then
            echo "Expected exactly one CodeQL SARIF file, found ${#sarif_files[@]}." >&2
            exit 1
          fi
          "$CODEQL" github upload-results \
            --repository="$GITHUB_REPOSITORY" \
            --ref="refs/pull/$PR_NUMBER/head" \
            --commit="$PR_HEAD_SHA" \
            --sarif="${sarif_files[0]}" \
            --checkout-path="$GITHUB_WORKSPACE/src"
