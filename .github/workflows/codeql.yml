name: CodeQL

on:
  push:
    branches:
      - development
      - master
  pull_request:
    branches:
      - development
      - master
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze GitHub Actions
    # A manual dispatch may select an arbitrary branch. Only trusted branches
    # may run the scanner with permission to publish CodeQL results.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/development' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Analyze with CodeQL
        uses: ./.github/actions/codeql-analysis
        with:
          output: ${{ runner.temp }}/codeql-results
          upload: always

  analyze-pr:
    name: Analyze GitHub Actions (read-only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      # The workflow and its helper action come from the trusted base revision.
      - name: Checkout trusted workflow helpers
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # PR source is input data for CodeQL only; never execute PR-controlled
      # scripts, actions, builds, or configuration.
      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: src
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Analyze with CodeQL
        uses: ./trusted/.github/actions/codeql-analysis
        with:
          source-root: src
          output: ${{ runner.temp }}/codeql-results
          upload: never
