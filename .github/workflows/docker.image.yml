name: Docker Image CI

# Default to read-only. Jobs that publish or upload SARIF opt in explicitly.
permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - $default-branch
      - development
      - master
    tags:
      - "*.*.*-*"
  delete:
  # Run tests for any PRs
  pull_request:
  schedule:
    - cron: "43 10 * * 4"

env:
  IMAGE_NAME: calcardbackup

jobs:
  super-linter:
    name: super-linter
    permissions:
      contents: read
    strategy:
      fail-fast: false
    concurrency:
      group: ${{ github.ref_type == 'branch' && format('docker-branch-{0}', github.ref) || format('docker-release-{0}', github.ref) }}
      cancel-in-progress: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # super-linter needs the full git history to get the
          # list of files that changed across commits
          fetch-depth: 0
          persist-credentials: false
      - name: Lint Code Base
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: master
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
          VALIDATE_TRIVY: false
          VALIDATE_BIOME_FORMAT: false
          MULTI_STATUS: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
  shiftleft:
    name: shiftleft
    outputs:
      sarif_artifact: shiftleft-sarif-${{ github.run_attempt }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Perform ShiftLeft Scan
        uses: ShiftLeftSecurity/scan-action@v1.3.0
        env:
          WORKSPACE: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_ANNOTATE_PR: false
          SCAN_AUTO_BUILD: true
        with:
          output: reports
          # Scan auto-detects the languages in your project. To override uncomment the below variable and set the type
          # type: credscan,java
          # type: python
      - name: Upload report artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: shiftleft-sarif-${{ github.run_attempt }}
          path: reports
          retention-days: 1
  test-build:
    outputs:
      image_artifact: ${{ steps.artifact.outputs.name }}
    needs:
      - super-linter
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set artifact name
        id: artifact
        run: echo "name=${IMAGE_NAME}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Test startup option handling
        run: bash tests/test_calcard_opts.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - name: Build the Docker image
        id: docker_test
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: false
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          tags: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            BUILD_VERSION="$(git describe --tags)"
            VCS_REF="$(git rev-parse --short HEAD)"
            VCS_URL="$(git config --get remote.origin.url)"
            VCS_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
  test:
    name: Run test
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test-build.outputs.image_artifact }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Inspect the Docker image
        run: |
          docker buildx imagetools inspect localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Test the Docker image
        run: |
          CONTAINER_OUTPUT=$(docker run --rm localhost:5000/foobar/${{ env.IMAGE_NAME }} /opt/calcardbackup/calcardbackup -h)
          echo "Container output: $CONTAINER_OUTPUT"
          echo "Container output (quoted): '$CONTAINER_OUTPUT'"

          TEST_STRING=$(echo "${CONTAINER_OUTPUT}" | grep 'START calcardbackup' | head -1 | sed "s/.*START //" | cut -d' ' -f1)
          echo "Extracted test string: '$TEST_STRING'"

          if ! [ "${TEST_STRING}" = "calcardbackup" ]; then
            echo "ERROR: Expected 'calcardbackup' but got '$TEST_STRING'"
            exit 1
          fi
  dockle:
    name: Run Dockle tests
    outputs:
      sarif_artifact: dockle-sarif-${{ github.run_attempt }}
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test-build.outputs.image_artifact }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run dockle container image linter
        id: dockle
        continue-on-error: true
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: "registry:5000/foobar/${{ env.IMAGE_NAME }}"
          insecure: true
          format: "sarif"
          exit-code: "1"
          exit-level: "warn"
          ignore: "CIS-DI-0001,CIS-DI-0010,DKL-DI-0006"
          output: dockle.sarif
      - name: Upload SARIF artifact
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: dockle-sarif-${{ github.run_attempt }}
          retention-days: 1
          path: dockle.sarif
          if-no-files-found: ignore
      - name: Fail job when Dockle reports findings
        if: always() && steps.dockle.outcome == 'failure'
        run: exit 1
  trivy:
    name: Run Trivy tests
    outputs:
      sarif_artifact: trivy-sarif-${{ github.run_attempt }}
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test-build.outputs.image_artifact }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          format: "template"
          template: "@/contrib/sarif.tpl"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload SARIF artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-${{ github.run_attempt }}
          retention-days: 1
          path: trivy-results.sarif
  anchore:
    name: Run Anchore tests
    outputs:
      sarif_artifact: anchore-sarif-${{ github.run_attempt }}
    needs:
      - test-build
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test-build.outputs.image_artifact }}
          path: /tmp
      - name: Load image and push to local registry
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar
          docker image ls -a
          docker push localhost:5000/foobar/${{ env.IMAGE_NAME }}
      - name: Run Anchore vulnerability scan
        uses: anchore/scan-action@v7.4.2
        with:
          image: localhost:5000/foobar/${{ env.IMAGE_NAME }}
          # SARIF is uploaded by the separate least-privilege uploader job.
          output-format: sarif
          fail-build: false
          output-file: "./results.sarif"
      - name: Move reports
        if: github.event_name != 'pull_request'
        run: mkdir -p sarif-reports && cp ./results.sarif ./sarif-reports/
      - name: Upload SARIF artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: anchore-sarif-${{ github.run_attempt }}
          retention-days: 1
          path: sarif-reports
  upload-sarif:
    name: Upload SARIF reports
    needs:
      - shiftleft
      - dockle
      - trivy
      - anchore
    if: >-
      always() &&
      (github.run_attempt == 1 || github.triggering_actor == 'waja') &&
      (
        (
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/development' ||
            (
              github.ref_type == 'tag' &&
              github.actor == 'waja' &&
              github.triggering_actor == 'waja'
            )
          )
        ) ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.ref == 'refs/heads/master' ||
            github.ref == 'refs/heads/development'
          ) &&
          github.actor == 'waja' &&
          github.triggering_actor == 'waja'
        )
      ) &&
      (
        needs.shiftleft.result == 'success' ||
        needs.dockle.result == 'success' ||
        needs.dockle.result == 'failure' ||
        needs.trivy.result == 'success' ||
        needs.anchore.result == 'success'
      )
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download ShiftLeft report
        if: always() && needs.shiftleft.outputs.sarif_artifact != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.shiftleft.outputs.sarif_artifact }}
          path: sarif-reports/shiftleft
      - name: Download Dockle report
        if: always() && needs.dockle.outputs.sarif_artifact != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.dockle.outputs.sarif_artifact }}
          path: sarif-reports/dockle
      - name: Download Trivy report
        if: always() && needs.trivy.outputs.sarif_artifact != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.trivy.outputs.sarif_artifact }}
          path: sarif-reports/trivy
      - name: Download Anchore report
        if: always() && needs.anchore.outputs.sarif_artifact != ''
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ needs.anchore.outputs.sarif_artifact }}
          path: sarif-reports/anchore
      - name: Upload ShiftLeft SARIF
        if: always() && hashFiles('sarif-reports/shiftleft/**/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-reports/shiftleft
      - name: Upload Dockle SARIF
        if: always() && hashFiles('sarif-reports/dockle/dockle.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-reports/dockle/dockle.sarif
      - name: Upload Trivy SARIF
        if: always() && hashFiles('sarif-reports/trivy/trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-reports/trivy/trivy-results.sarif
      - name: Upload Anchore SARIF
        if: always() && hashFiles('sarif-reports/anchore/**/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-reports/anchore
  release-docker:
    name: Release Docker images
    outputs:
      image: ${{ steps.prep.outputs.image }}
      release_tag_current: ${{ steps.publish_tag_freshness.outputs.current }}
    # Keep publishing credentials away from PR code and untrusted manual refs.
    # Reruns are authorized against the user who triggered the rerun as well.
    if: >-
      github.event_name != 'pull_request' &&
      github.event_name != 'delete' &&
      github.event.deleted != true &&
      (github.run_attempt == 1 || github.triggering_actor == 'waja') &&
      (
        github.event_name != 'push' ||
        github.ref_type != 'tag' ||
        github.actor == 'waja'
      ) &&
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.actor == 'waja' &&
          (
            github.ref == 'refs/heads/development' ||
            github.ref == 'refs/heads/master'
          )
        )
      )
    permissions:
      contents: read
      packages: write
    needs:
      - test-build
      - test
      - shiftleft
      - dockle
      - trivy
      - anchore
    strategy:
      fail-fast: false
    concurrency:
      group: ${{ github.ref_type == 'branch' && format('docker-publish-branch-{0}', github.ref) || 'docker-release-tags' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check release tag freshness
        id: tag_freshness
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale release run for $tag at $GITHUB_SHA; current tag target is $(git rev-parse "refs/tags/$tag^{commit}")"
          fi

      - name: Check branch freshness
        id: freshness
        if: github.ref_type == 'branch'
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale branch build $GITHUB_SHA; current tip is $(git rev-parse FETCH_HEAD)"
          fi

      - name: Prepare
        id: prep
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          EVENT_DELETED: ${{ github.event.deleted == true }}
        run: |
          USER="${GITHUB_REPOSITORY_OWNER}"
          IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_NAME="${IMAGE_NAME#docker-}"
          DOCKER_IMAGE="${USER}/${IMAGE_NAME}"
          echo "image=${DOCKER_IMAGE}" >> "$GITHUB_OUTPUT"
          VERSION=edge
          # running on a tag
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # running on a branch
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            VERSION="${GITHUB_REF#refs/heads/}"
          fi
          # running on schedule
          # shellcheck disable=SC2050
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VERSION=nightly
          fi
          # Keep branch and exact release tags separate from mutable aliases.
          TAGS=""
          if [ "$DOCKERHUB_USERNAME" != '' ] && [ "$DOCKERHUB_TOKEN" != '' ]; then
            TAGS="${DOCKER_IMAGE}:${VERSION}"
          fi
          if [ "$GITHUB_TOKEN" != '' ]; then
            TAGS="${TAGS:+$TAGS,}ghcr.io/${DOCKER_IMAGE}:${VERSION}"
          fi
          if [ "$QUAY_USERNAME" != '' ] && [ "$QUAY_TOKEN" != '' ]; then
            TAGS="${TAGS:+$TAGS,}quay.io/${DOCKER_IMAGE}:${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test-build.outputs.image_artifact }}
          path: /tmp

      - name: Load image from test job
        run: |
          docker load --input /tmp/${{ env.IMAGE_NAME }}-${{ github.run_number }}.tar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to ghcr
        if: >-
          (github.ref_type != 'branch' || steps.freshness.outputs.current == 'true') &&
          env.GITHUB_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${USER}
          password: ${{ env.GITHUB_TOKEN }}

      - name: Login to DockerHub Container Registry
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        if: >-
          (github.ref_type != 'branch' || steps.freshness.outputs.current == 'true') &&
          env.DOCKERHUB_USERNAME != '' &&
          env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Login to Quay Container Registry
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
        if: >-
          (github.ref_type != 'branch' || steps.freshness.outputs.current == 'true') &&
          env.QUAY_USERNAME != '' &&
          env.QUAY_TOKEN != ''
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_TOKEN }}

      - name: Test
        id: docker_test
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            BUILD_VERSION="$(git describe --tags)"
            VCS_REF="$(git rev-parse --short HEAD)"
            VCS_URL="$(git config --get remote.origin.url)"
            VCS_BRANCH="$(git rev-parse --abbrev-ref HEAD)"

      - name: Recheck branch freshness before publishing
        id: publish_freshness
        if: github.ref_type == 'branch'
        run: |
          git fetch --no-tags origin "$GITHUB_REF"
          if [ "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale branch publish $GITHUB_SHA; current tip is $(git rev-parse FETCH_HEAD)"
          fi

      - name: Recheck release tag freshness before publishing
        id: publish_tag_freshness
        if: github.ref_type == 'tag'
        run: |
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          tag="${GITHUB_REF#refs/tags/}"
          current_target="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [ "$current_target" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale release publish for $tag at $GITHUB_SHA; current tag target is ${current_target:-missing}"
          fi

      - name: Build and push
        id: docker_build
        if: >-
          (github.ref_type != 'branch' || steps.publish_freshness.outputs.current == 'true') &&
          (github.ref_type != 'tag' || steps.publish_tag_freshness.outputs.current == 'true')
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.prep.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
          build-args: |
            BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            BUILD_VERSION="$(git describe --tags)"
            VCS_REF="$(git rev-parse --short HEAD)"
            VCS_URL="$(git config --get remote.origin.url)"
            VCS_BRANCH="$(git rev-parse --abbrev-ref HEAD)"

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  publish-release-aliases:
    name: Publish release aliases
    if: >-
      always() &&
      (github.run_attempt == 1 || github.triggering_actor == 'waja') &&
      (
        (
          github.event_name == 'push' &&
          github.ref_type == 'tag' &&
          (
            github.event.deleted == true ||
            (
              github.actor == 'waja' &&
              needs.release-docker.result == 'success' &&
              needs.release-docker.outputs.release_tag_current == 'true'
            )
          )
        ) ||
        (
          github.event_name == 'delete' &&
          github.event.ref_type == 'tag'
        )
      )
    needs:
      - release-docker
    concurrency:
      group: docker-release-tags
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: ${{ needs.release-docker.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'delete' || github.event.deleted == true) && 'development' || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image name for deleted release
        if: github.event_name == 'delete' || github.event.deleted == true
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY#*/}"
          IMAGE_NAME="${IMAGE_NAME#docker-}"
          echo "DOCKER_IMAGE=${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Recheck release tag before alias reconciliation
        id: alias_tag_freshness
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.deleted != true
        run: |
          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          tag="${GITHUB_REF#refs/tags/}"
          current_target="$(git rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [ "$current_target" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping alias reconciliation for stale release tag $tag at $GITHUB_SHA; current tag target is ${current_target:-missing}"
          fi

      - name: Reconcile release aliases
        if: >-
          github.event_name == 'delete' ||
          github.event.deleted == true ||
          steps.alias_tag_freshness.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
          EVENT_DELETED: ${{ github.event.deleted == true }}
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then
            printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          fi
          if [ -n "$QUAY_USERNAME" ] && [ -n "$QUAY_TOKEN" ]; then
            printf '%s' "$QUAY_TOKEN" | docker login quay.io -u "$QUAY_USERNAME" --password-stdin
          fi

          git fetch --force --prune --prune-tags origin '+refs/tags/*:refs/tags/*'
          RELEASES="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' | sort -V || true)"
          if [ -z "$RELEASES" ]; then
            if [ "$GITHUB_EVENT_NAME" = "delete" ] || [ "$EVENT_DELETED" = "true" ]; then
              echo "::error::No release tags remain. Remove any orphaned release aliases manually; generic manifest deletion could also remove exact version tags."
              exit 1
            fi
            exit 0
          fi

          registries=()
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            registries+=(docker.io)
          fi
          if [ -n "$GITHUB_TOKEN" ]; then
            registries+=(ghcr.io)
          fi
          if [ -n "$QUAY_USERNAME" ] && [ -n "$QUAY_TOKEN" ]; then
            registries+=(quay.io)
          fi
          (( "${#registries[@]}" )) || exit 0

          inspect_image() {
            local image="$1"
            local output
            if output=$(docker buildx imagetools inspect "$image" 2>&1); then
              return 0
            fi
            if printf '%s\n' "$output" | grep -Eiq 'manifest[_ -]unknown|no such manifest|(^|[^[:alnum:]_/-])manifest[[:space:]]+(not found|does not exist)'; then
              return 1
            fi
            echo "::error::Unable to inspect $image: $output"
            return 2
          }

          # Determine the highest releases from the union of published images.
          # A missing tag is skipped; any other inspection error aborts before
          # aliases are changed, avoiding accidental rollback on transient errors.
          declare -A image_available=()
          available_releases=()
          inspection_failed=false
          for version in $RELEASES; do
            version_available=false
            for registry in "${registries[@]}"; do
              source_image="$registry/$DOCKER_IMAGE:$version"
              if inspect_image "$source_image"; then
                image_available["$registry:$version"]=true
                version_available=true
              else
                inspect_status=$?
                if [ "$inspect_status" -eq 2 ]; then
                  inspection_failed=true
                fi
              fi
            done
            [ "$version_available" = true ] && available_releases+=("$version")
          done
          if [ "$inspection_failed" = true ]; then
            echo "::error::Release image inspection failed; no aliases were changed"
            exit 1
          fi
          if (( "${#available_releases[@]}" == 0 )); then
            echo "::error::No published release images are available; refusing to silently skip alias reconciliation"
            exit 1
          fi

          registry_releases="$(printf '%s\n' "${available_releases[@]}")"
          highest() {
            printf '%s\n' "$registry_releases" | grep -E "$1" | tail -n 1 || true
          }
          last_index=$((${#available_releases[@]} - 1))
          latest_version="${available_releases[$last_index]}"

          # Build a complete alias plan before changing any registry. A configured
          # registry missing a selected source image is an inconsistent release
          # publication; fail visibly instead of leaving older aliases in place.
          declare -a alias_plan=()
          preflight_failed=false
          for version in "${available_releases[@]}"; do
            [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-[0-9]+$ ]] || continue
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            aliases=()

            [ "$version" = "$(highest "^$major\.$minor\.$patch-")" ] && aliases+=("$major.$minor.$patch")
            [ "$version" = "$(highest "^$major\.$minor\.")" ] && aliases+=("$major.$minor")
            [ "$version" = "$(highest "^$major\.")" ] && aliases+=("$major")
            [ "$version" = "$latest_version" ] && aliases+=(latest)
            (( "${#aliases[@]}" )) || continue

            for alias in "${aliases[@]}"; do
              for registry in "${registries[@]}"; do
                if [ "${image_available["$registry:$version"]:-false}" != true ]; then
                  echo "::error::Cannot reconcile $alias: selected source $registry/$DOCKER_IMAGE:$version is missing"
                  preflight_failed=true
                else
                  alias_plan+=("$registry|$alias|$version")
                fi
              done
            done
          done
          if [ "$preflight_failed" = true ]; then
            echo "::error::At least one configured registry is missing a selected release image; no aliases were changed. Restore the exact release tags and rerun."
            exit 1
          fi

          publication_failed=false
          for entry in "${alias_plan[@]}"; do
            IFS='|' read -r registry alias version <<< "$entry"
            source_image="$registry/$DOCKER_IMAGE:$version"
            target_image="$registry/$DOCKER_IMAGE:$alias"
            published=false
            for attempt in 1 2 3; do
              if docker buildx imagetools create --tag "$target_image" "$source_image"; then
                published=true
                break
              fi
              echo "::warning::Attempt $attempt/3 failed to publish $target_image from $source_image"
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 2))
              fi
            done
            if [ "$published" != true ]; then
              echo "::error::Failed to publish $target_image from $source_image after 3 attempts"
              publication_failed=true
            fi
          done

          if [ "$publication_failed" = true ]; then
            echo "::error::One or more release aliases could not be published after retries; rerun this job to reconcile all aliases"
            exit 1
          fi
