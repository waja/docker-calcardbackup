name: PR SARIF Handoff POC

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful pull_request run ID from Docker Image CI
        required: true
        type: string
      upload_sarif:
        description: Upload validated SARIF to Code Scanning (keep false for dry-run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-source:
    name: Verify source run and image artifact
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.verify.outputs.pr_number }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      artifact_name: ${{ steps.verify.outputs.artifact_name }}
    steps:
      - name: Verify source run, PR identity, jobs and artifact metadata
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || { echo "source_run_id must be numeric" >&2; exit 1; }

          run="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg repo "$REPOSITORY" '
            .repository.full_name == $repo and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .path == ".github/workflows/docker.image.yml" and
            .workflow_id == 3382216 and
            (.head_sha | type == "string" and length == 40) and
            (.head_repository.id | type == "number")
          ' <<<"$run" >/dev/null || { echo "Source run is not a successful PR run of the expected workflow/repository" >&2; exit 1; }

          run_number="$(jq -r '.run_number' <<<"$run")"
          head_sha="$(jq -r '.head_sha' <<<"$run")"
          head_repo_id="$(jq -r '.head_repository.id' <<<"$run")"
          head_repo_full_name="$(jq -r '.head_repository.full_name' <<<"$run")"
          head_branch="$(jq -r '.head_branch' <<<"$run")"

          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" --jq '.jobs')"
          jq -e 'any(.[]; .name == "test-build" and .conclusion == "success")' <<<"$jobs" >/dev/null || {
            echo "The source run did not complete test-build successfully" >&2
            exit 1
          }

          prs="$(jq -c '.pull_requests // []' <<<"$run")"
          if [[ "$(jq 'length' <<<"$prs")" -eq 0 ]]; then
            owner="${head_repo_full_name%%/*}"
            prs="$(gh api --method GET "repos/$REPOSITORY/pulls" -f state=open -f "head=$owner:$head_branch")"
          fi
          [[ "$(jq 'length' <<<"$prs")" -eq 1 ]] || { echo "Could not resolve exactly one open PR for source run" >&2; exit 1; }

          pr="$(jq '.[0]' <<<"$prs")"
          pr_number="$(jq -r '.number' <<<"$pr")"
          jq -e --arg sha "$head_sha" --argjson repo_id "$head_repo_id" '
            .state == "open" and
            .head.sha == $sha and
            .head.repo.id == $repo_id and
            .base.repo.full_name == env.REPOSITORY
          ' <<<"$pr" >/dev/null || { echo "PR identity, base repository, or head SHA does not match source run" >&2; exit 1; }

          artifact_name="calcardbackup-$run_number"
          artifacts="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" --jq '.artifacts')"
          jq -e --arg name "$artifact_name" --argjson run_id "$SOURCE_RUN_ID" --arg sha "$head_sha" --argjson repo_id "$head_repo_id" '
            any(.[]; .name == $name and .expired == false and .workflow_run.id == $run_id and .workflow_run.head_sha == $sha and .workflow_run.head_repository_id == $repo_id and .size_in_bytes > 0)
          ' <<<"$artifacts" >/dev/null || { echo "Expected image artifact missing, expired, or not owned by source run" >&2; exit 1; }

          {
            echo "pr_number=$pr_number"
            echo "head_sha=$head_sha"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

  scan-image:
    name: Scan verified image artifact
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dockle: ${{ steps.pack.outputs.dockle }}
      trivy: ${{ steps.pack.outputs.trivy }}
      anchore: ${{ steps.pack.outputs.anchore }}
    steps:
      - name: Download verified image artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.verify-source.outputs.artifact_name }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/image

      - name: Load image as data (do not start it)
        run: |
          set -euo pipefail
          image_tar="$(find /tmp/image -maxdepth 1 -type f -name '*.tar' -print -quit)"
          test -n "$image_tar"
          docker load --input "$image_tar"
          docker image inspect localhost:5000/foobar/calcardbackup >/dev/null

      - name: Run Dockle
        id: dockle
        continue-on-error: true
        uses: goodwithtech/dockle-action@v0.4.15
        with:
          image: localhost:5000/foobar/calcardbackup
          format: sarif
          exit-code: "1"
          exit-level: warn
          ignore: CIS-DI-0001,CIS-DI-0010,DKL-DI-0006
          output: dockle.sarif

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/foobar/calcardbackup
          format: template
          template: "@/contrib/sarif.tpl"
          output: trivy.sarif
          severity: CRITICAL,HIGH

      - name: Run Anchore
        uses: anchore/scan-action@v7.4.2
        with:
          image: localhost:5000/foobar/calcardbackup
          output-format: sarif
          fail-build: false
          output-file: anchore.sarif

      - name: Validate and encode SARIF for job-output handoff
        id: pack
        run: |
          set -euo pipefail
          encode_report() {
            local name="$1" file="$2" encoded
            test -s "$file"
            jq -e '
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0) and
              all(.runs[]; (.tool.driver.name | type == "string" and length > 0))
            ' "$file" >/dev/null
            encoded="$(gzip -n -c "$file" | base64 -w0)"
            if (( ${#encoded} > 280000 )); then
              echo "$name SARIF exceeds the conservative per-report output budget" >&2
              exit 1
            fi
            printf '%s=%s\n' "$name" "$encoded" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${#encoded}" >> /tmp/sarif-output-sizes
          }
          : > /tmp/sarif-output-sizes
          encode_report dockle dockle.sarif
          encode_report trivy trivy.sarif
          encode_report anchore anchore.sarif
          total="$(awk '{sum += $1} END {print sum}' /tmp/sarif-output-sizes)"
          if (( total > 850000 )); then
            echo "Combined SARIF outputs exceed conservative 850000-character budget" >&2
            exit 1
          fi
          echo "Encoded SARIF payload size: $total characters"

  validate-sarif:
    name: Validate SARIF handoff (dry-run)
    needs:
      - verify-source
      - scan-image
    if: always() && needs.verify-source.result == 'success' && needs.scan-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Re-verify PR head after scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.verify-source.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.verify-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$REPOSITORY" '
            .state == "open" and .head.sha == $sha and .base.repo.full_name == $repo
          ' <<<"$pr" >/dev/null || { echo "PR changed or closed after scan" >&2; exit 1; }

      - name: Validate transferred SARIF and report payload sizes
        env:
          DOCKLE: ${{ needs.scan-image.outputs.dockle }}
          TRIVY: ${{ needs.scan-image.outputs.trivy }}
          ANCHORE: ${{ needs.scan-image.outputs.anchore }}
        run: |
          set -euo pipefail
          for name in DOCKLE TRIVY ANCHORE; do
            value="${!name}"
            test -n "$value"
            (( ${#value} <= 280000 ))
            printf '%s' "$value" | base64 -d | gzip -t
            printf '%s' "$value" | base64 -d | gzip -dc | jq -e '
              .version == "2.1.0" and (.runs | type == "array" and length > 0)
            ' >/dev/null
            echo "$name: ${#value} encoded characters; transfer and SARIF validation succeeded"
          done

  upload-sarif:
    name: Upload SARIF (explicit opt-in)
    needs:
      - verify-source
      - scan-image
      - validate-sarif
    if: inputs.upload_sarif && needs.verify-source.result == 'success' && needs.scan-image.result == 'success' && needs.validate-sarif.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Re-verify PR head immediately before reporting
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.verify-source.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.verify-source.outputs.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$REPOSITORY" '
            .state == "open" and .head.sha == $sha and .base.repo.full_name == $repo
          ' <<<"$pr" >/dev/null || { echo "PR changed or closed immediately before upload; refusing SARIF report" >&2; exit 1; }
          echo "pr_ref=refs/pull/$PR_NUMBER/head" >> "$GITHUB_OUTPUT"

      - name: Upload Dockle SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ steps.target.outputs.pr_ref }}
          HEAD_SHA: ${{ needs.verify-source.outputs.head_sha }}
          SARIF: ${{ needs.scan-image.outputs.dockle }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg commit "$HEAD_SHA" --arg ref "$PR_REF" --arg sarif "$SARIF" '{commit_sha:$commit,ref:$ref,sarif:$sarif,tool_name:"Dockle"}')"
          gh api --method POST "repos/$REPOSITORY/code-scanning/sarifs" --input <(printf '%s' "$payload")

      - name: Upload Trivy SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ steps.target.outputs.pr_ref }}
          HEAD_SHA: ${{ needs.verify-source.outputs.head_sha }}
          SARIF: ${{ needs.scan-image.outputs.trivy }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg commit "$HEAD_SHA" --arg ref "$PR_REF" --arg sarif "$SARIF" '{commit_sha:$commit,ref:$ref,sarif:$sarif,tool_name:"Trivy"}')"
          gh api --method POST "repos/$REPOSITORY/code-scanning/sarifs" --input <(printf '%s' "$payload")

      - name: Upload Anchore SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_REF: ${{ steps.target.outputs.pr_ref }}
          HEAD_SHA: ${{ needs.verify-source.outputs.head_sha }}
          SARIF: ${{ needs.scan-image.outputs.anchore }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg commit "$HEAD_SHA" --arg ref "$PR_REF" --arg sarif "$SARIF" '{commit_sha:$commit,ref:$ref,sarif:$sarif,tool_name:"Anchore"}')"
          gh api --method POST "repos/$REPOSITORY/code-scanning/sarifs" --input <(printf '%s' "$payload")
