name: PR SARIF Handoff POC

# This workflow is loaded from the default branch by workflow_run. Never dispatch
# it from a PR ref: its upload job has a narrowly scoped Code Scanning token.
on:
  workflow_run:
    workflows: ["Docker Image CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  scan:
    name: Rebuild with trusted Dockerfile and scan as data
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.verify.outputs.pr_number }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      sarif_0: ${{ steps.pack.outputs.sarif_0 }}
      sarif_1: ${{ steps.pack.outputs.sarif_1 }}
      sarif_2: ${{ steps.pack.outputs.sarif_2 }}
      sarif_3: ${{ steps.pack.outputs.sarif_3 }}
      sarif_4: ${{ steps.pack.outputs.sarif_4 }}
      sarif_5: ${{ steps.pack.outputs.sarif_5 }}
      sarif_6: ${{ steps.pack.outputs.sarif_6 }}
      sarif_7: ${{ steps.pack.outputs.sarif_7 }}
      sarif_8: ${{ steps.pack.outputs.sarif_8 }}
      sarif_9: ${{ steps.pack.outputs.sarif_9 }}
    steps:
      - name: Verify completed source run and resolve full PR
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REPOSITORY_ID: ${{ github.event.workflow_run.head_repository.id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -n "$HEAD_REPOSITORY" && "$HEAD_REPOSITORY_ID" =~ ^[0-9]+$ ]]

          run="$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          jq -e --arg repo "$REPOSITORY" --arg sha "$EXPECTED_SHA" --arg head_repo "$HEAD_REPOSITORY" --argjson head_repo_id "$HEAD_REPOSITORY_ID" '
            .repository.full_name == $repo and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            (.path | split("@")[0]) == ".github/workflows/docker.image.yml" and
            .workflow_id == 3382216 and
            .head_sha == $sha and
            .head_repository.full_name == $head_repo and
            .head_repository.id == $head_repo_id
          ' <<<"$run" >/dev/null

          jobs="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" --jq '.jobs')"
          jq -e 'any(.[]; .name == "test-build" and .conclusion == "success")' <<<"$jobs" >/dev/null

          prs="$(gh api --paginate "repos/$REPOSITORY/commits/$EXPECTED_SHA/pulls?per_page=100")"
          matches="$(jq --arg repo "$REPOSITORY" --arg sha "$EXPECTED_SHA" --argjson repo_id "$HEAD_REPOSITORY_ID" '
            [.[] | select(
              .state == "open" and
              .base.repo.full_name == $repo and
              .base.ref == "development" and
              .head.sha == $sha and
              .head.repo.id == $repo_id
            )]
          ' <<<"$prs")"
          [[ "$(jq 'length' <<<"$matches")" -eq 1 ]] || {
            echo "Could not resolve exactly one open PR matching the source run repository and head SHA" >&2
            exit 1
          }
          pr_number="$(jq -r '.[0].number' <<<"$matches")"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout PR source at the verified immutable commit
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr-source
          persist-credentials: false

      - name: Checkout trusted Dockerfile from default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: Dockerfile
          persist-credentials: false

      - name: Build image using only the trusted Dockerfile
        run: |
          set -euo pipefail
          docker build --pull --file trusted/Dockerfile --tag localhost:5000/foobar/calcardbackup:pr-scan pr-source

      - name: Run Dockle
        uses: goodwithtech/dockle-action@v0.4.15
        continue-on-error: true
        with:
          image: localhost:5000/foobar/calcardbackup:pr-scan
          format: sarif
          exit-code: "1"
          exit-level: warn
          ignore: CIS-DI-0001,CIS-DI-0010,DKL-DI-0006
          output: dockle.sarif

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: localhost:5000/foobar/calcardbackup:pr-scan
          format: template
          template: "@/contrib/sarif.tpl"
          output: trivy.sarif
          severity: CRITICAL,HIGH

      - name: Run Anchore
        uses: anchore/scan-action@v7.4.2
        with:
          image: localhost:5000/foobar/calcardbackup:pr-scan
          output-format: sarif
          fail-build: false
          output-file: anchore.sarif

      - name: Validate and pack combined SARIF into bounded chunks
        id: pack
        run: |
          set -euo pipefail
          for file in dockle.sarif trivy.sarif anchore.sarif; do
            test -s "$file"
            jq -e '
              .version == "2.1.0" and
              (.runs | type == "array" and length > 0) and
              all(.runs[]; (.tool.driver.name | type == "string" and length > 0))
            ' "$file" >/dev/null
          done

          jq -s '{version:"2.1.0", "$schema":"https://json.schemastore.org/sarif-2.1.0.json", runs: map(.runs[]) }' \
            dockle.sarif trivy.sarif anchore.sarif > combined.sarif
          jq -e '.version == "2.1.0" and (.runs | length >= 3)' combined.sarif >/dev/null
          encoded="$(base64 -w0 combined.sarif)"
          # Keep the whole job output comfortably below GitHub's 1 MB limit.
          (( ${#encoded} <= 300000 )) || {
            echo "Combined SARIF exceeds the 300000-character handoff budget" >&2
            exit 1
          }
          for index in {0..9}; do
            start=$((index * 30000))
            chunk="${encoded:start:30000}"
            printf 'sarif_%s=%s\n' "$index" "$chunk" >> "$GITHUB_OUTPUT"
          done
          echo "Combined validated SARIF encoded size: ${#encoded} characters"

  upload:
    name: Upload verified SARIF
    needs: scan
    if: needs.scan.result == 'success' && vars.ENABLE_PR_SARIF_UPLOAD == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Recheck PR identity and head immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.scan.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.scan.outputs.head_sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$REPOSITORY" --arg sha "$EXPECTED_SHA" '
            .state == "open" and
            .base.repo.full_name == $repo and
            .base.ref == "development" and
            .head.sha == $sha and
            .head.repo.full_name != null
          ' <<<"$pr" >/dev/null || {
            echo "PR is closed, retargeted, or has moved since scanning; refusing upload" >&2
            exit 1
          }

      - name: Reassemble bounded SARIF chunks and submit once
        id: submit
        env:
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.scan.outputs.pr_number }}
          HEAD_SHA: ${{ needs.scan.outputs.head_sha }}
          SARIF_0: ${{ needs.scan.outputs.sarif_0 }}
          SARIF_1: ${{ needs.scan.outputs.sarif_1 }}
          SARIF_2: ${{ needs.scan.outputs.sarif_2 }}
          SARIF_3: ${{ needs.scan.outputs.sarif_3 }}
          SARIF_4: ${{ needs.scan.outputs.sarif_4 }}
          SARIF_5: ${{ needs.scan.outputs.sarif_5 }}
          SARIF_6: ${{ needs.scan.outputs.sarif_6 }}
          SARIF_7: ${{ needs.scan.outputs.sarif_7 }}
          SARIF_8: ${{ needs.scan.outputs.sarif_8 }}
          SARIF_9: ${{ needs.scan.outputs.sarif_9 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded="${SARIF_0}${SARIF_1}${SARIF_2}${SARIF_3}${SARIF_4}${SARIF_5}${SARIF_6}${SARIF_7}${SARIF_8}${SARIF_9}"
          test -n "$encoded"
          (( ${#encoded} <= 300000 ))
          printf '%s' "$encoded" | base64 -d > combined.sarif
          jq -e '.version == "2.1.0" and (.runs | length >= 3)' combined.sarif >/dev/null

          # Recheck a second time directly before creating the upload.
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$REPOSITORY" --arg sha "$HEAD_SHA" '
            .state == "open" and .base.repo.full_name == $repo and .head.sha == $sha
          ' <<<"$pr" >/dev/null

          sarif="$(base64 -w0 combined.sarif)"
          payload="$(jq -n --arg commit "$HEAD_SHA" --arg ref "refs/pull/$PR_NUMBER/head" --arg data "$sarif" '
            {commit_sha:$commit, ref:$ref, sarif:$data}
          ')"
          response="$(gh api --method POST "repos/$REPOSITORY/code-scanning/sarifs" --input <(printf '%s' "$payload"))"
          upload_id="$(jq -r '.id // empty' <<<"$response")"
          [[ -n "$upload_id" ]] || {
            echo "SARIF API did not return an upload ID" >&2
            exit 1
          }
          echo "upload_id=$upload_id" >> "$GITHUB_OUTPUT"

      - name: Wait for GitHub Code Scanning to process SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPLOAD_ID: ${{ steps.submit.outputs.upload_id }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status="$(gh api "repos/$REPOSITORY/code-scanning/sarifs/$UPLOAD_ID")"
            state="$(jq -r '.processing_status // empty' <<<"$status")"
            case "$state" in
              complete)
                echo "GitHub completed SARIF processing"
                exit 0
                ;;
              failed)
                jq -r '.errors // .message // "SARIF processing failed"' <<<"$status" >&2
                exit 1
                ;;
              pending)
                sleep 10
                ;;
              *)
                echo "Unexpected SARIF processing state: $state" >&2
                jq . <<<"$status" >&2
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for SARIF processing" >&2
          exit 1
